<style>
/* 레이아웃: 시험 답안지처럼 번호 매긴 행으로 이어지는 단일 열. 하단 탭 + 전체화면 학습 세션. */
:root{

  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){

    --paper:#11151C; --card:#19202A; --ink:#E6EBF4; --ink2:#9AA6BB; --line:#2A3443;
    --ai:#93AAF0; --ai-soft:#222D49; --stamp:#F07A66;
    --ok:#62C79E; --ok-soft:#1D3329; --warn:#E5B55F; --warn-soft:#3A3018; --bad:#F07A66; --bad-soft:#3E2220;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151C; --card:#19202A; --ink:#E6EBF4; --ink2:#9AA6BB; --line:#2A3443;
  --ai:#93AAF0; --ai-soft:#222D49; --stamp:#F07A66;
  --ok:#62C79E; --ok-soft:#1D3329; --warn:#E5B55F; --warn-soft:#3A3018; --bad:#F07A66; --bad-soft:#3E2220;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.shell{max-width:680px;margin:0 auto;padding-block:14px 104px}
.jp{font-family:var(--f-jp);font-weight:800}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:700}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:20px 2px 8px}
.sec-title h2{font-size:14px;letter-spacing:.02em;color:var(--ink2);font-weight:700}
/* hero */
.hero{display:flex;gap:14px;align-items:center;justify-content:space-between}.hero>div:first-child{min-width:0;flex:1}
.dday{font:600 54px/1 var(--f-mono);color:var(--stamp);letter-spacing:-.03em}
.hero small{display:block;color:var(--ink2);font-size:13px;margin-top:6px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring .tx{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring b{font:600 24px var(--f-mono)}
.ring span{font-size:11px;color:var(--ink2)}
.daybar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink2)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--ai-soft);color:var(--ai);font-size:12px;font-weight:700}
.tag.stamp{background:transparent;border:1.5px solid var(--stamp);color:var(--stamp);transform:rotate(-4deg)}
/* segments */
.seg{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 4px;border-top:1px solid var(--line)}
.seg:first-of-type{border-top:0}
.bub{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:grid;place-content:center;font:600 14px var(--f-mono);color:var(--ink2)}
.seg.part .bub{border-color:var(--ai);color:var(--ai);background:conic-gradient(var(--ai-soft) calc(var(--p)*1%),transparent 0)}
.seg.done .bub{background:var(--ai);border-color:var(--ai);color:var(--card)}
.seg .t{font-weight:700;font-size:15px}
.seg .d{font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.seg .m{font:500 12px var(--f-mono);color:var(--ink2);white-space:nowrap}
.seg.done .t{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;background:var(--ai);color:var(--card);font-weight:700;min-height:44px}
.btn.ghost{background:transparent;color:var(--ai);border:1.5px solid var(--ai)}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* stats */
.stat{margin-bottom:12px}.stat:last-child{margin-bottom:0}
.stat .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.sbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line)}
.sbar i{display:block;height:100%}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}
.leg b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font:500 11px var(--f-mono);color:var(--ink2);text-align:center;padding-bottom:2px}
.cal i{display:block}
.cd{aspect-ratio:1/1;min-height:40px;border-radius:10px;border:1px solid var(--line);display:grid;place-content:center;text-align:center;font:500 12px/1.15 var(--f-mono);position:relative;background:var(--card)}
.cd small{display:block;font-size:9px;color:var(--ink2)}
.cd.done{background:var(--ai);border-color:var(--ai);color:var(--card)}.cd.done small{color:inherit;opacity:.8}
.cd.today{border:2px solid var(--ai);font-weight:700}
.cd.miss{border-style:dashed;border-color:var(--stamp);color:var(--stamp)}
.cd.exam{border:2px solid var(--stamp);color:var(--stamp);font-weight:700;font-family:var(--f-jp)}
.cd.part{background:var(--ai-soft)}
.cd.done::after{content:"済";position:absolute;right:3px;bottom:1px;font:800 9px var(--f-jp);opacity:.85}
/* plan list */
.ph{margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink2);font-weight:700}
.pd{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.pd.today{border:2px solid var(--ai)}
.pd .dt{font:600 13px var(--f-mono)}.pd .dt small{display:block;font-weight:500;color:var(--ink2);font-size:11px}
.pd .sc{font-size:13px;overflow-wrap:anywhere}.pd .sc small{display:block;color:var(--ink2)}
/* weak */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500}
.chip.on{background:var(--ai);border-color:var(--ai);color:var(--card)}
.wr{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.wr:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.dot.s1{background:var(--bad)}.dot.s2{background:var(--warn)}
.wr .w{font-family:var(--f-jp);font-weight:800;font-size:18px;overflow-wrap:anywhere}
.wr .w small{font:400 12px var(--f-jps);color:var(--ink2);margin-left:6px}
.wr .mm{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
/* settings */
.seg2{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg2 button{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:500;background:var(--card)}
.seg2 button.on{background:var(--ai);color:var(--card)}
textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:12px/1.4 var(--f-mono);padding:10px;resize:vertical;margin-top:10px}
.note{font-size:12.5px;color:var(--ink2);margin:8px 0 0}
/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs>div{width:100%;max-width:680px;margin:0 auto;display:flex}
.tabs button{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:500;color:var(--ink2);border-radius:10px}
.tabs button.on{color:var(--ai);font-weight:700}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:relative}.badge em{position:absolute;top:-4px;right:-12px;background:var(--stamp);color:#fff;font:600 10px var(--f-mono);border-radius:99px;padding:0 5px;min-width:16px;text-align:center;font-style:normal}

  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.ov>.in{width:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.oh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.oh .x{width:40px;height:40px;border-radius:12px;display:grid;place-content:center;border:1px solid var(--line);background:var(--card)}
.oh .x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.oh .tt{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oh .tm{font:500 12px var(--f-mono);color:var(--ink2)}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--ai);transition:width .2s}
.card{flex:1;min-height:300px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;width:100%}
.card .cm{font:500 12px var(--f-mono);color:var(--ink2);letter-spacing:.04em}
.big{font-family:var(--f-jp);font-weight:800;line-height:1.25;overflow-wrap:anywhere;font-size:64px}
.big.l2{font-size:50px}.big.l3{font-size:38px}.big.l4{font-size:29px}
.big.ko{font-family:var(--f-body);font-weight:700}
.rd{font:500 22px var(--f-jps);color:var(--ai)}
.mn{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.hint{font-size:13px;color:var(--ink2)}
.gb{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);margin-top:12px}
.gb.two{grid-template-columns:repeat(2,1fr)}

.gb .g1{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.gb .g2{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.gb .g3{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}

.gx .bl{background:var(--paper);border-radius:12px;padding:10px 12px}
.gx .bl h4{margin:0 0 4px;font-size:11px;letter-spacing:.06em;color:var(--ink2);font-weight:700}
.gx .ex{padding:6px 0;border-top:1px dashed var(--line)}.gx .ex:first-of-type{border-top:0}

.cat{display:inline-block;align-self:center;padding:2px 10px;border-radius:99px;background:var(--ai-soft);color:var(--ai);font-size:12px;font-weight:700}
mark{background:var(--warn-soft);color:var(--ink);border-radius:4px;padding:0 3px;font-weight:700}
.blank{display:inline-block;min-width:64px;border-bottom:2.5px solid var(--ink);margin:0 2px}

.qb{flex:1;display:flex;flex-direction:column;gap:12px}
.qp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center;display:grid;gap:8px;min-height:150px;align-content:center}
.qp .lab{font:600 11px var(--f-mono);letter-spacing:.08em;color:var(--ai)}
.qp .sentence{font:500 20px/1.7 var(--f-jps);text-align:left}
.qp .sub{font-size:13px;color:var(--ink2)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;padding:12px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;min-height:54px;overflow-wrap:anywhere}
.opt .mk{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-content:center;font:600 13px var(--f-mono);color:var(--ink2)}
.opt .ot{font-size:15px}.opt .ot.j{font:500 18px/1.4 var(--f-jps)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.right .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .mk{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;display:grid;gap:3px}
.fb b.ok{color:var(--ok)}.fb b.no{color:var(--bad)}
.fb .jx{font:500 16px/1.5 var(--f-jps)}
.sum{text-align:center;padding:24px 8px;display:grid;gap:12px;justify-items:center}
.sum .n{font:600 56px/1 var(--f-mono);color:var(--ai)}
.wl{width:100%;text-align:left;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:99px;font-size:13px;max-width:86vw;text-align:center}
@media (min-width:600px){.big{font-size:72px}.card{min-height:380px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(()=>{
'use strict';
/* ================= 데이터 ================= */
const VD=JSON.parse(document.getElementById('dv').textContent);
const G=JSON.parse(document.getElementById('dg').textContent);
const V=[];VD.forEach((d,i)=>d.w.forEach((x,j)=>V.push({id:'v'+(i+1)+'-'+(j+1),d:i+1,n:j+1,w:x[0],r:x[1],m:x[2]})));
const VM=new Map(V.map(x=>[x.id,x])),GM=new Map(G.map(x=>[x.id,x]));
const VBYD=VD.map((_,i)=>V.filter(x=>x.d===i+1));
const CL={'조사':'조사','부사':'부사','접속사':'접속사','경어':'경어','명사':'명사 접속','동사':'동사 접속','공통':'명사·동사','복합':'여러 품사'};
const GSEC=['조사','부사','접속사','경어','명사','동사','공통','복합'];
const GW={'조사':40,'부사':15,'접속사':20,'경어':35,'명사':60,'동사':60,'공통':60,'복합':60}; // 문법 1개당 예상 초
const p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ================= 날짜 ================= */
const START=new Date(2026,10,7),EXAM=new Date(2026,11,6),LAST=29;
const WD=['일','월','화','수','목','금','토'];

const tkey=()=>{const n=new Date();return n.getFullYear()*10000+(n.getMonth()+1)*100+n.getDate();};
const dateOf=i=>new Date(2026,10,6+i);
const dayIdx=()=>Math.round((today()-START)/864e5)+1;
const curDay=()=>Math.min(LAST,Math.max(1,dayIdx()));
const dLeft=()=>Math.round((EXAM-today())/864e5);
const fmt=d=>(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')';
const fmtS=d=>(d.getMonth()+1)+'/'+d.getDate();
/* ================= 저장 ================= */
const KEY='n1-last-sheet-v1';
const blank=()=>({v:{},g:{},sec:{},min:{},cfg:{dir:'w2m'},at:0});
let storeOK=true;
function load(){try{localStorage.setItem(KEY+'-probe','1');localStorage.removeItem(KEY+'-probe');}catch(e){storeOK=false;}try{const t=localStorage.getItem(KEY);if(t)return Object.assign(blank(),JSON.parse(t));}catch(e){storeOK=false;}return blank();}
let S=load(),saveT=0;
function save(now){clearTimeout(saveT);S.at=Date.now();const f=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));storeOK=true;}catch(e){storeOK=false;}};f();}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
const hm=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes());};
const savedAt=()=>{if(!S.at)return'아직 없음';const d=new Date(S.at),n=new Date();return (d.toDateString()===n.toDateString()?'오늘 ':(d.getMonth()+1)+'/'+d.getDate()+' ')+hm(S.at);};
const bkDays=()=>S.cfg.bk?Math.floor((Date.now()-S.cfg.bk)/864e5):-1;
const bkText=()=>{const d=bkDays();return d<0?'아직 없음':d===0?'오늘':d+'일 전';};
const hasProg=()=>Object.keys(S.v).length+Object.keys(S.g).length>0;
const getS=(k,id)=>(S[k][id]||{}).s||0;
const getT=(k,id)=>(S[k][id]||{}).t||0;
const setS=(k,id,s)=>{S[k][id]={s,t:tkey()};};
/* ================= RNG ================= */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const shuf=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,r)=>a[Math.floor(r()*a.length)];

const VP=[['か','が'],['き','ぎ'],['く','ぐ'],['け','げ'],['こ','ご'],['さ','ざ'],['し','じ'],['す','ず'],['せ','ぜ'],['そ','ぞ'],['た','だ'],['て','で'],['と','ど'],['は','ば'],['ひ','び'],['ふ','ぶ'],['へ','べ'],['ほ','ぼ'],['は','ぱ'],['ひ','ぴ'],['ふ','ぷ'],['へ','ぺ'],['ほ','ぽ']];
const VOI={};VP.forEach(([a,b])=>{(VOI[a]=VOI[a]||[]).push(b);(VOI[b]=VOI[b]||[]).push(a);});

function mutate(rd,r){
  const ch=[...rd],ops=[];
  const vi=ch.map((c,i)=>VOI[c]?i:-1).filter(i=>i>=0);
  if(vi.length)ops.push(()=>{const i=pick(vi,r),c=ch.slice();c[i]=pick(VOI[ch[i]],r);return c.join('');});
  const lo=ch.map((c,i)=>(OR.includes(c)&&ch[i+1]!=='う')||(ER.includes(c)&&ch[i+1]!=='い')?i:-1).filter(i=>i>=0);
  if(lo.length)ops.push(()=>{const i=pick(lo,r),c=ch.slice();c.splice(i+1,0,OR.includes(ch[i])?'う':'い');return c.join('');});
  const lr=ch.map((c,i)=>i>0&&((c==='う'&&OR.includes(ch[i-1]))||(c==='い'&&ER.includes(ch[i-1])))?i:-1).filter(i=>i>=0);
  if(lr.length)ops.push(()=>{const i=pick(lr,r),c=ch.slice();c.splice(i,1);return c.join('');});
  if(rd.includes('っ'))ops.push(()=>rd.replace('っ',''));

function makeVQuiz(items,r){

function gvars(f,min){
  f=f.replace(/\(격식↓\)/g,'');const out=[];
  f.split(' / ').forEach(p=>{
    p=p.trim().replace(/^[～〜\-]+/,'');
    if(/[⋯…]/.test(p))return;
    const m=p.match(/^(.*?)\((.*?)\)(.*)$/);
    if(m){out.push(m[1]+m[3]);out.push(m[1]+m[2].split('/')[0]+m[3]);}else out.push(p);
  });
  return[...new Set(out.filter(x=>x.length>=min))].sort((a,b)=>b.length-a.length);
}
function gmatch(g,min){
  const vs=gvars(g.f,min);
  for(let i=0;i<g.e.length;i++){const jp=g.e[i][0];for(const v of vs){const k=jp.indexOf(v);if(k>=0)return{jp,v,k,i};}}
  return null;
}

}

function preFam(p){p=p.replace(/\s/g,'');return p.startsWith('명사')?'N':p.startsWith('동사')?'V':p.startsWith('い형')?'A':p.startsWith('な형')?'NA':'?';}

function pickQuizItems(arr,k,r,n){

function buildQuiz(d,id,n){

function pickAns(i){
  const sg=ses.sg,q=(ses.retry||sg.qs)[sg.i];

  const right=i===q.a;

  const k=q.k;

    else{sg.wrong.push(sg.i);setS(k,q.id,1);}

  }
  save();render();
}

<div class="sheet">${rows||'<p class="muted" style="margin:0">아직 약점으로 표시된 항목이 없어요. 학습을 시작하면 채워져요.</p>'}${list.length>ui.wn?`<div style="text-align:center;margin-top:10px"><button class="btn sm line" data-a="more">더 보기 (${list.length-ui.wn})</button></div>`:''}</div>`;
}
function viewSet(){
  return`<div class="hdr"><span class="brand">설정 · 백업</span></div>
<div class="sheet"><h2 style="margin-bottom:10px">단어 카드 방향</h2><div class="seg2"><button class="${S.cfg.dir==='w2m'?'on':''}" data-a="dir" data-v="w2m">단어 → 읽기·뜻</button><button class="${S.cfg.dir==='m2w'?'on':''}" data-a="dir" data-v="m2w">뜻 → 단어</button></div></div>
<div class="sheet"><h2 style="margin-bottom:6px">저장 상태</h2><p style="margin:0;font-size:14px">${storeOK?'자동 저장 켜짐':'<b style="color:var(--bad)">이 브라우저에서는 저장되지 않아요</b>'} · <span class="muted">마지막 저장 ${savedAt()}</span></p><p class="note" style="margin:6px 0 0">카드를 넘기거나 문제를 풀 때마다 이 기기의 브라우저에 자동으로 저장돼요. 마지막 백업: ${bkText()}</p></div>
<div class="sheet"><h2 style="margin-bottom:6px">진도 백업 / 복원</h2><p class="note" style="margin:0 0 10px">기기를 바꾸거나 사이트 데이터를 지우기 전에 백업해 두세요. 파일은 「파일」 앱이나 카카오톡 나에게 보내기 등에 보관하면 돼요. 복원하면 지금 진도를 덮어써요.</p>
<div class="row"><button class="btn sm" data-a="bkfile">파일로 저장</button><button class="btn sm line" data-a="pickfile">파일에서 복원</button><input type="file" id="bkf" accept=".txt,text/plain" style="position:absolute;left:-9999px;opacity:0;width:1px;height:1px" tabindex="-1" aria-hidden="true"></div>
<div class="row" style="margin-top:10px"><button class="btn sm ghost" data-a="mkbackup">백업 코드 만들기</button><button class="btn sm line" data-a="copybackup">복사</button></div>
<textarea id="bk" placeholder="백업 코드가 여기에 나와요. 복원하려면 코드를 붙여넣고 아래 버튼을 누르세요." spellcheck="false">${esc(ui.backup)}</textarea>
<div class="row" style="margin-top:10px"><button class="btn sm" data-a="restore">이 코드로 복원</button></div></div>
<div class="sheet"><h2 style="margin-bottom:6px">진도 초기화</h2>${ui.reset?'<p class="note" style="margin:0 0 10px;color:var(--bad)">모든 진도와 약점 기록이 지워져요. 정말 지울까요?</p><div class="row"><button class="btn sm" style="background:var(--bad)" data-a="doreset">지우기</button><button class="btn sm line" data-a="noreset">취소</button></div>':'<button class="btn sm line" data-a="reset">초기화…</button>'}</div>
<div class="sheet"><h2 style="margin-bottom:6px">자료 정보</h2><p class="note" style="margin:0">업로드한 해커스 N1 단어장(40 DAY, ${V.length.toLocaleString()}개)과 문법 정리표(${G.length}개)를 PDF에서 자동으로 옮겼어요. 교재 원문의 오탈자나 PDF에서 빠진 글자가 있을 수 있어서, 이상한 곳은 교재를 우선으로 보세요. 접속 형태 문제는 교재 표기를 기준으로 해요.</p></div>`;
}
function tabs(){
  const wk=weakCount();
  const T=[['home','오늘',ICON.home],['plan','일정',ICON.cal],['weak','약점',ICON.flag],['set','설정',ICON.gear]];
  return`<nav class="tabs"><div>${T.map(([k,l,ic])=>`<button class="${ui.tab===k?'on':''}" data-a="tab" data-t="${k}">${k==='weak'&&wk?`<span class="badge">${ic}<em>${wk>99?'99+':wk}</em></span>`:ic}${l}</button>`).join('')}</div></nav>`;
}
/* ---- 세션 화면 ---- */
function vCard(it,flip){
  const m2w=S.cfg.dir==='m2w';
  const meta=`DAY ${p2(it.d)} · ${String(it.n).padStart(3,'0')}`;
  if(!m2w){
    return`<div class="card" data-a="flip"><div class="cm">${meta}</div><div class="big ${bigCls(it.w)}">${esc(it.w)}</div>${flip?`${it.r?`<div class="rd">${esc(it.r)}</div>`:''}<div class="mn">${esc(it.m)}</div>`:'<div class="hint">탭해서 읽기·뜻 확인</div>'}</div>`;
  }
  return`<div class="card" data-a="flip"><div class="cm">${meta}</div><div class="big ko ${bigCls(it.m)}" style="font-size:${[...it.m].length>10?26:34}px">${esc(it.m)}</div>${flip?`<div class="big ${bigCls(it.w)}" style="font-size:44px">${esc(it.w)}</div>${it.r?`<div class="rd">${esc(it.r)}</div>`:''}`:'<div class="hint">탭해서 단어 확인</div>'}</div>`;
}
function gCard(g,flip){
  const cat=`<span class="cat">${CL[g.c]}${g.s?' · '+esc(g.s):''} · ${g.n}</span>`;
  const front=g.x?`<div class="big ${bigCls(g.f)}">${esc(g.f)}</div><div class="hint">존경어 / 겸양어는?</div>`:`<div class="big ${bigCls(g.f)}">${esc(g.f)}</div>`;
  let back='';
  if(flip){
    const blocks=[];
    if(g.x){
      blocks.push(`<div class="bl"><h4>뜻</h4>${esc(g.m[0])}</div>`);
      blocks.push(`<div class="bl"><h4>존경어</h4><span class="jp" style="font-size:18px">${esc(g.x.h[0]||'—')}</span> <span class="muted">${esc(g.x.h[1])}</span></div>`);
      blocks.push(`<div class="bl"><h4>겸양어</h4><span class="jp" style="font-size:18px">${esc(g.x.k[0]||'—')}</span> <span class="muted">${esc(g.x.k[1])}</span></div>`);
    }else if(g.c==='조사'){
      blocks.push(`<div class="bl"><h4>뜻 · 예문</h4>${g.m.map((m,i)=>`<div class="ex"><b>${esc(m)}</b>${g.e[i]?`<div class="j">${esc(g.e[i][0])}</div><div class="k">${esc(g.e[i][1])}</div>`:''}</div>`).join('')}</div>`);
    }else{
      blocks.push(`<div class="bl"><h4>뜻</h4><b>${esc(g.m.join(' / '))}</b></div>`);
      if(g.k&&g.k.length)blocks.push(`<div class="bl"><h4>접속</h4>${g.k.map(k=>`<div class="j" style="font:500 15px var(--f-jps)">${esc(k)}</div>`).join('')}</div>`);
      if(g.e&&g.e.length)blocks.push(`<div class="bl"><h4>예문</h4>${g.e.map(e=>`<div class="ex"><div class="j">${esc(e[0])}</div><div class="k">${esc(e[1])}</div></div>`).join('')}</div>`);
    }
    back=`<div class="gx">${blocks.join('')}</div>`;
  }else back='<div class="hint">탭해서 뜻·접속·예문 확인</div>';
  return`<div class="card" data-a="flip" style="${flip?'justify-content:flex-start;overflow:auto':''}">${cat}${front}${back}</div>`;
}
function ovCards(){
  const sg=ses.sg,n=sg.deck.length;
  if(ses.sum){
    const c=sg.c;
    return`<div class="sum"><div class="n">${n}</div><div><b>카드 ${n}장 완료</b></div><div class="row" style="justify-content:center"><span class="tag" style="background:var(--bad-soft);color:var(--bad)">모름 ${c[0]}</span><span class="tag" style="background:var(--warn-soft);color:var(--warn)">애매 ${c[1]}</span><span class="tag" style="background:var(--ok-soft);color:var(--ok)">앎 ${c[2]}</span></div><p class="note">모름·애매 카드는 약점 노트에 쌓이고, 내일 워밍업에 다시 나와요.</p>${ses.free?'<button class="btn" data-a="close">닫기</button>':`<button class="btn" data-a="next">${segList(ses.d).some(s=>s.id!==ses.id&&!segDone(ses.d,s.id))?'다음 파트':'오늘 마치기'}</button>`}<button class="und" data-a="undo">마지막 카드 되돌리기</button></div>`;
  }
  const id=sg.deck[sg.i],k=id[0]==='v'?'v':'g',it=(k==='v'?VM:GM).get(id);
  const card=k==='v'?vCard(it,ses.flip):gCard(it,ses.flip);
  const wrap=ses.id==='wrap';
  const bar=!ses.flip?`<div class="gb" style="grid-template-columns:1fr"><button class="btn" data-a="flip" style="min-height:56px">정답 보기</button></div>`
    :wrap?`<div class="gb two"><button class="g1" data-a="g" data-v="1">아직 모름<small>1</small></button><button class="g2" data-a="g" data-v="2">이제 알겠음<small>2</small></button></div>`
    :`<div class="gb"><button class="g1" data-a="g" data-v="1">모름<small>1</small></button><button class="g2" data-a="g" data-v="2">애매<small>2</small></button><button class="g3" data-a="g" data-v="3">앎<small>3</small></button></div>`;
  return`${card}${bar}${ses.hist.length?'<button class="und" data-a="undo">← 되돌리기</button>':''}`;
}
function ovQuiz(){
  const sg=ses.sg,list=ses.retry||sg.qs,n=list.length;
  if(ses.sum){
    if(ses.retryDone)return`<div class="sum"><div class="n">완료</div><p class="note">틀렸던 문제를 다시 풀었어요.</p><button class="btn" data-a="endretry">결과로 돌아가기</button></div>`;
    const w=sg.wrong.map(i=>sg.qs[i]);
    const pc=Math.round(sg.ok/n*100);
    return`<div class="sum"><div class="n">${sg.ok}<span style="font-size:24px" class="muted">/${n}</span></div><div><b>정답률 ${pc}%</b></div>
${w.length?`<div class="sheet wl"><h2 style="margin-bottom:6px">틀린 문제 ${w.length}개</h2>${w.map(q=>`<div class="wr" style="grid-template-columns:12px 1fr"><span class="dot s1"></span><div class="mm"><span class="jp" style="color:var(--ink);font-size:15px">${esc(q.ex[0])}</span></div></div>`).join('')}</div>`:'<p class="note">전부 맞혔어요.</p>'}
<div class="row" style="justify-content:center">${w.length?'<button class="btn ghost" data-a="retry">틀린 것 다시 풀기</button>':''}${ses.free?'<button class="btn" data-a="close">닫기</button>':`<button class="btn" data-a="next">${segList(ses.d).some(s=>s.id!==ses.id&&!segDone(ses.d,s.id))?'다음 파트':'오늘 마치기'}</button>`}</div></div>`;
  }
  const q=list[sg.i],key=ses.retry?'r'+sg.i:sg.i,ans=sg.ans[key],done=ans!==undefined;
  const prompt=q.s!==undefined?`<div class="sentence">${jpText(q.s)}</div>`:`<div class="big ${q.pj?bigCls(q.p):'ko'}" style="${q.pj?'':'font-size:24px'}">${esc(q.p)}</div>`;
  const opts=q.o.map((t,i)=>{
    let c='opt';if(done){if(i===q.a)c+=' right';else if(i===ans)c+=' wrong';else c+=' dim';}
    return`<button class="${c}" data-a="pick" data-i="${i}"><span class="mk">${i+1}</span><span class="ot ${q.oj?'j':''}">${esc(t)}</span></button>`;
  }).join('');
  const fb=done?`<div class="fb"><b class="${ans===q.a?'ok':'no'}">${ans===q.a?'정답':'오답'}</b>${q.ex.map((l,i)=>`<div class="${i===0?'jx':'muted'}" style="${i?'font-size:13px':''}">${esc(l)}</div>`).join('')}</div><button class="btn" data-a="nq" style="min-height:52px">${sg.i+1>=n?'결과 보기':'다음 문제'}</button>`:'';
  return`<div class="qb"><div class="qp"><div class="lab">${esc(q.lab)} · ${sg.i+1}/${n}</div>${prompt}<div class="sub">${esc(q.sub)}</div></div><div class="opts">${opts}</div>${fb}</div>`;
}
function ovHTML(){
  const sg=ses.sg,tot=ses.kind==='cards'?sg.deck.length:(ses.retry||sg.qs).length;
  const pr=ses.sum?100:Math.round(sg.i/tot*100);
  const body=ses.kind==='cards'?ovCards():ovQuiz();
  return`<div class="ov"><div class="in"><div class="oh"><button class="x" data-a="close" aria-label="닫기">${ICON.x}</button><div class="tt">${esc(ses.free?ses.label:'Day '+ses.d+' · '+ses.label)}</div><div class="tm" id="tm">${tmText()}</div></div><div class="prog"><i style="width:${pr}%"></i></div>${body}</div></div>`;
}
const tmText=()=>{if(!ses||ses.free)return'';const l=segList(ses.d);return '오늘 '+l.filter(x=>segDone(ses.d,x.id)).length+'/'+l.length+'파트';};
function render(){
  if(ses){$app.innerHTML=ovHTML();return;}
  let h='';
  if(ui.tab==='home')h=viewHome();else if(ui.tab==='plan')h=viewPlan();else if(ui.tab==='weak')h=viewWeak();else h=viewSet();
  $app.innerHTML=`<div class="shell">${h}</div>${tabs()}`;
}
/* ================= 이벤트 ================= */
let lastAct=Date.now();
const $app=document.getElementById('app');
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,()=>{lastAct=Date.now();},{passive:true}));
$app.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  switch(a){
    case'tab':ui.tab=el.dataset.t;ui.day=null;render();window.scrollTo(0,0);break;
    case'day':ui.tab='plan';ui.day=+el.dataset.d;render();window.scrollTo(0,0);break;
    case'back':ui.day=null;render();break;
    case'seg':openSeg(+el.dataset.d,el.dataset.s);break;
    case'flip':if(ses&&ses.kind==='cards'&&!ses.sum){ses.flip=!ses.flip;render();}break;
    case'g':grade(+el.dataset.v);break;
    case'undo':undo();break;
    case'pick':pickAns(+el.dataset.i);break;
    case'nq':nextQ();break;
    case'retry':retryWrong();break;
    case'endretry':endRetry();break;
    case'next':nextSeg();break;
    case'close':closeSes();break;
    case'free':startFree(el.dataset.t);break;
    case'wf':ui.wf=el.dataset.f;ui.wn=60;render();break;
    case'more':ui.wn+=60;render();break;
    case'known':setS(el.dataset.k,el.dataset.id,3);save();render();break;
    case'dir':S.cfg.dir=el.dataset.v;save();render();break;
    case'mkbackup':ui.backup=makeBackup();render();break;
    case'bkfile':bkFile();break;
    case'pickfile':{const f=document.getElementById('bkf');if(f)f.click();break;}
    case'copybackup':copyBackup();break;
    case'restore':restoreBackup();break;
    case'reset':ui.reset=1;render();break;
    case'noreset':ui.reset=0;render();break;
    case'doreset':S=blank();ui.reset=0;ui.backup='';save(true);render();toast('진도를 초기화했어요');break;
  }
});
document.addEventListener('keydown',e=>{
  if(!ses||e.target.tagName==='TEXTAREA')return;
  if(ses.kind==='cards'&&!ses.sum){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!ses.flip){ses.flip=true;render();}}
    else if(ses.flip&&['1','2','3'].includes(e.key)){if(ses.id==='wrap'&&e.key==='3')return;grade(+e.key);}
    else if(e.key==='Backspace'||e.key==='z')undo();
  }else if(ses.kind==='quiz'&&!ses.sum){
    const sg=ses.sg,key=ses.retry?'r'+sg.i:sg.i,done=sg.ans[key]!==undefined;
    if(['1','2','3','4'].includes(e.key)&&!done)pickAns(+e.key-1);
    else if((e.key==='Enter'||e.key===' ')&&done){e.preventDefault();nextQ();}
  }
});
/* ---- 백업 ---- */
function makeBackup(){
  const done={},part={};
  Object.keys(S.sec).forEach(d=>Object.keys(S.sec[d]).forEach(id=>{const x=S.sec[d][id];
    if(x.done||x.was)(done[d]=done[d]||[]).push(id);
    if(!x.done&&x.deck&&x.deck.length&&x.i>0)(part[d]=part[d]||{})[id]={deck:x.deck,i:x.i,c:x.c,n:x.n||1};}));
  const o={v:S.v,g:S.g,min:S.min,cfg:S.cfg,done,part};
  return'N1L1|'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function restoreBackup(t){
  if(typeof t!=='string')t=document.getElementById('bk').value||'';
  t=t.trim();
  try{
    if(!t.startsWith('N1L1|'))throw 0;
    const o=JSON.parse(decodeURIComponent(escape(atob(t.slice(5)))));
    const n=blank();n.v=o.v||{};n.g=o.g||{};n.min=o.min||{};n.cfg=Object.assign(n.cfg,o.cfg||{});n.cfg.bk=Date.now();
    Object.keys(o.done||{}).forEach(d=>{n.sec[d]={};o.done[d].forEach(id=>{n.sec[d][id]={done:true,i:0,deck:[],c:[0,0,0]};});});
    Object.keys(o.part||{}).forEach(d=>{n.sec[d]=n.sec[d]||{};Object.keys(o.part[d]).forEach(id=>{const x=o.part[d][id];
      if(Array.isArray(x.deck)&&x.i>0&&x.i<x.deck.length&&x.deck.every(k=>VM.has(k)||GM.has(k)))n.sec[d][id]={deck:x.deck,i:x.i,c:x.c||[0,0,0],done:false,n:x.n||1};});});
    S=n;save(true);ui.backup='';render();toast('진도를 복원했어요');
  }catch(e){toast('코드를 읽을 수 없어요. 처음부터 끝까지 복사했는지 확인해 주세요');}
}
async function bkFile(){
  const code=makeBackup(),d=new Date();
  const name='n1-progress-'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'.txt';
  try{
    const f=new File([code],name,{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'N1 진도 백업'});}
    else{const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
    S.cfg.bk=Date.now();save(true);toast('백업 파일을 만들었어요');render();
  }catch(e){if(e&&e.name==='AbortError')return;toast('파일로 저장하지 못했어요. 백업 코드를 복사해 주세요');}
}
$app.addEventListener('change',ev=>{
  const el=ev.target;
  if(el&&el.id==='bkf'&&el.files&&el.files[0]){
    const r=new FileReader();r.onload=()=>restoreBackup(String(r.result||''));r.onerror=()=>toast('파일을 읽을 수 없어요');r.readAsText(el.files[0]);el.value='';
  }
});
function copyBackup(){
  const ta=document.getElementById('bk');if(!ta||!ta.value){toast('먼저 백업 코드를 만들어 주세요');return;}
  const fb=()=>{ta.focus();ta.select();toast('코드를 선택했어요. 길게 눌러 복사해 주세요');};
  try{navigator.clipboard.writeText(ta.value).then(()=>{S.cfg.bk=Date.now();save(true);toast('복사했어요');},fb);}catch(e){fb();}
}
/* ---- 공부 시간 ---- */
setInterval(()=>{
  if(!ses||document.visibilityState!=='visible'||Date.now()-lastAct>90000)return;
  const k=tkey();S.min[k]=(S.min[k]||0)+1;
  const e=document.getElementById('tm');if(e)e.textContent=tmText();
  if(S.min[k]%15===0)save();
},1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save(true);});
window.addEventListener('pagehide',()=>save(true));
render();
})();
</script>
